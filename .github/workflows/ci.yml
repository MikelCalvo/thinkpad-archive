name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify tests, syntax, builds and internal links
        env:
          PACKAGE: ${{ matrix.python == '3.13' && 'yes' || 'no' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          Path('build').mkdir(exist_ok=True)
          argv = [sys.executable, 'tools/check.py', '--output', 'build/ci']
          if os.environ['PACKAGE'] == 'yes':
              argv.append('--package')
          subprocess.run(argv, check=True, timeout=1000)
          PY
      - name: Check changed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          base = os.environ.get('BASE_SHA', '')
          head = os.environ['HEAD_SHA']
          if re.fullmatch(r'[a-f0-9]{40}', head) is None:
              raise SystemExit('Invalid checked commit')
          if not base or base == '0' * 40:
              base = subprocess.check_output(['git', 'hash-object', '-t', 'tree', '--stdin'], input=b'').decode().strip()
          elif re.fullmatch(r'[a-f0-9]{40}', base) is None:
              raise SystemExit('Invalid base commit')
          subprocess.run(['git', 'diff', '--check', base, head], check=True, timeout=30)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python == '3.13'
        with:
          name: offline-release
          path: build/ci/offline/*
          if-no-files-found: error
          retention-days: 7

  workflows:
    name: Workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        env:
          GOTOOLCHAIN: auto
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -shellcheck= -pyflakes=
